[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esaddm"
version = "0.1.0"
description = "Reproducible code for ES/EE attentional diffusion modelling"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "pandas>=1.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
